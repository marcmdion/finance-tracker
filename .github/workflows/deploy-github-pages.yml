name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Public Firebase client config (safe to embed — was in the original index.html)
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBoXFpkoQvANb68vMpnksdrlnLkCSrpuDU
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: finance-tracker-27d5f.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: finance-tracker-27d5f
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: finance-tracker-27d5f.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "663637652591"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:663637652591:web:964666791865943d6b899a
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-GCLL7V05G4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
